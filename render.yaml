# Render Blueprint (infra-as-code). Deploy: connect this repo as a Blueprint in the Render dashboard.
# Secrets marked `sync: false` are set once in the dashboard (never committed).
services:
  # Worker API (FastAPI) — the web app's Refresh button calls POST /projects/{id}/refresh here.
  # Protected by WORKER_SECRET (X-Worker-Secret header); set the SAME value on the web host (Vercel).
  - type: web
    name: trendradar-worker
    runtime: python
    rootDir: worker
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATA_SOURCE
        value: scrapecreators
      - key: DATABASE_URL
        sync: false
      - key: SCRAPECREATORS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WORKER_SECRET
        sync: false # set the SAME value here and on the web host (Vercel)

  # Trending Songs chart refresh (SPEC §4.5). Region-native per platform: IN=Instagram only,
  # US=Instagram+TikTok. IG costs 1 + IG_TOP_N credits/region (enriches the top reels' audio), so
  # ~2x/week keeps it fresh without heavy spend (~25 credits/refresh). Same entrypoint as
  # `python refresh_trending_sounds.py IN US` locally.
  - type: cronjob
    name: trendradar-trending-sounds
    runtime: python
    rootDir: worker
    schedule: "0 6 * * 1,4" # Mon & Thu 06:00 UTC (~every 3 days)
    buildCommand: pip install -r requirements.txt
    startCommand: python refresh_trending_sounds.py # regions from TRENDING_REGIONS env
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATA_SOURCE
        value: scrapecreators
      - key: TRENDING_REGIONS
        value: IN,US # comma-separated; IN→IG only, US→IG+TikTok (see REGION_PLATFORMS)
      - key: IG_TOP_N
        value: "12" # top trending reels enriched for audio per region (credits = 1 + IG_TOP_N)
      - key: SCRAPECREATORS_API_KEY
        sync: false # set in dashboard
      - key: DATABASE_URL
        sync: false # set in dashboard (Supabase pooled connection string)
