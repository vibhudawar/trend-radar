# Render Blueprint (infra-as-code). Deploy: connect this repo as a Blueprint in the Render dashboard.
# Secrets marked `sync: false` are set once in the dashboard (never committed).
services:
  # Global Trending Songs chart refresh (SPEC §4.5). Fetches the trending sounds per region and
  # upserts `trending_sounds`. Trending audio shifts over days, so once daily is plenty (~2 credits/day
  # for US+IN). Runs the same entrypoint as `python refresh_trending_sounds.py US IN` locally.
  - type: cronjob
    name: trendradar-trending-sounds
    runtime: python
    rootDir: worker
    schedule: "0 6 * * *" # daily 06:00 UTC (11:30 IST)
    buildCommand: pip install -r requirements.txt
    startCommand: python refresh_trending_sounds.py # regions from TRENDING_REGIONS env
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATA_SOURCE
        value: scrapecreators
      - key: TRENDING_REGIONS
        value: US,IN # comma-separated; change here to add/remove chart countries
      - key: DATABASE_URL
        sync: false # set in dashboard (Supabase pooled connection string)
      - key: SCRAPECREATORS_API_KEY
        sync: false # set in dashboard
